# DuckClean API — Cloudflare Worker.
#
# Video bytes never enter this Worker. It signs R2 URLs, writes metadata and job
# state, dispatches signed worker calls and meters usage.

name = "duckclean-api"
main = "src/index.ts"
compatibility_date = "2026-11-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Postgres through Hyperdrive. `localConnectionString` is a development DSN only
# and holds no production credential.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
localConnectionString = "postgres://duckclean:duckclean@127.0.0.1:5432/duckclean"

# Source, proxy, poster, masks, beat segments, previews, outputs.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "duckclean-media"

# Job dispatch and retry. DB rows remain the source of truth for job state.
[[queues.producers]]
binding = "JOBS"
queue = "duckclean-jobs"

[[queues.consumers]]
queue = "duckclean-jobs"
max_batch_size = 1
max_retries = 3
max_concurrency = 2
dead_letter_queue = "duckclean-jobs-dlq"

[vars]
APP_ENV = "development"
API_VERSION = "v1"
# Public Clerk frontend API origin, and the allowed JWT issuer/audience.
CLERK_ISSUER = "https://example.clerk.accounts.dev"
CLERK_AUDIENCE = "duckclean"
# Worker fleet base URLs. Empty in M0; task 3 wires dispatch.
CPU_WORKER_URL = ""
GPU_WORKER_URL = ""
# Browser origins allowed to call the API.
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173"

[observability]
enabled = true
head_sampling_rate = 1.0
