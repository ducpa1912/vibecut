[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "duckclean-worker"
version = "0.1.0"
description = "DuckClean CPU/GPU worker: probe, dissect, detect, render, preview."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
include = ["duckclean_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["duckclean_worker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and a throwaway HMAC key.
"tests/*" = ["S101", "S105", "S107", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["duckclean_worker", "tests"]
